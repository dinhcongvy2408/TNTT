# =====================================================================
# Môi trường PRODUCTION — VPS Vietnix.
# Nguyên tắc: KHÔNG có giá trị mặc định cho secret. Thiếu biến môi trường
# thì app phải chết ngay lúc khởi động, chứ không được chạy bằng mật khẩu
# mặc định của file dev.
# =====================================================================

spring:
  datasource:
    # Không có ':giá_trị_mặc_định' — cố ý. Thiếu env là app không lên.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20

  jpa:
    show-sql: false

# ---------------- TẮT Swagger ở production ----------------
# docs/04-api.md yêu cầu. Trang Swagger phơi bày toàn bộ sơ đồ API và cấu
# trúc dữ liệu — với hệ thống chứa hồ sơ trẻ em, đó là bản đồ cho kẻ tấn công.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${APP_JWT_SECRET}

logging:
  level:
    root: WARN
    vn.tntt: INFO
    # KHÔNG BAO GIỜ bật SQL log ở đây — nó in ra dữ liệu cá nhân của trẻ
    org.hibernate.SQL: OFF
  file:
    name: /var/log/tntt/application.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
