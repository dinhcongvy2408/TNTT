
# =====================================================================
# Cấu hình DÙNG CHUNG cho mọi môi trường.
# Phần khác nhau giữa dev/prod nằm ở application-dev.yml / application-prod.yml.
#
# Cú pháp ${BIEN_MOI_TRUONG:giá_trị_mặc_định}:
#   lấy biến môi trường, không có thì dùng giá trị sau dấu hai chấm.
#   Nhờ vậy chạy local không cần set gì, mà lên VPS vẫn đổi được bằng env.
# =====================================================================

spring:
  application:
    name: tntt-backend

  profiles:
    # Đổi bằng biến môi trường SPRING_PROFILES_ACTIVE khi deploy
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- Kết nối database ----------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:tntt}
    username: ${POSTGRES_USER:tntt}
    password: ${POSTGRES_PASSWORD:tntt_dev_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 150 huynh trưởng dùng đồng thời KHÔNG cần 150 connection: mỗi request
      # chỉ giữ connection vài chục mili-giây. 10 là dư cho quy mô này, và
      # PostgreSQL mặc định chỉ chịu 100 connection tổng.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: TnttHikariPool

  # ---------------- JPA / Hibernate ----------------
  jpa:
    hibernate:
      # 'validate' = lúc khởi động, Hibernate ĐỐI CHIẾU entity với bảng thật
      # và báo lỗi nếu lệch. KHÔNG BAO GIỜ để 'update' (CLAUDE.md mục 3):
      # 'update' cho Hibernate tự ALTER TABLE theo suy đoán của nó — có thể
      # âm thầm mất cột, và không ai biết production đang ở schema version nào.
      # Người duy nhất được sửa schema là Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        # Gộp nhiều INSERT thành một lần gửi xuống DB. Sprint 4 import 1.000
        # hồ sơ sẽ cần cái này; bật sẵn từ đầu để không quên.
        jdbc:
          batch_size: 50
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true
    # false = đóng session ngay khi controller trả về.
    # Mặc định của Spring Boot là true, và đó là cái bẫy LazyInitializationException
    # ngược đời: để true thì lazy loading vẫn chạy được ở tầng view, nghĩa là
    # ta có thể vô tình bắn N+1 query mà không hề biết. Để false buộc ta phải
    # nạp đủ dữ liệu trong service — nơi ta kiểm soát được.
    open-in-view: false

  # ---------------- Flyway ----------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Kiểm tra checksum: nếu ai đó sửa một file migration ĐÃ CHẠY, app không
    # khởi động. Đúng như vậy — file migration đã chạy là bất biến, muốn đổi
    # thì viết file V mới.
    validate-on-migrate: true

  # ---------------- Jackson (JSON) ----------------
  jackson:
    # Ngày giờ trả ra dạng ISO-8601 "2026-09-06T08:15:00+07:00",
    # không phải mảng số [2026,9,6,8,15] khó đọc.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      # File Excel 1.000 dòng thường dưới 1 MB; 10 MB là dư và vẫn chặn
      # được người upload nhầm file video.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  # Nén response — quan trọng với mạng yếu ở nhà thờ
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024
  error:
    # KHÔNG lộ stacktrace ra client. Chi tiết lỗi chỉ nằm trong log server.
    include-stacktrace: never
    include-message: never

# ---------------- Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        # Chỉ mở health. Các endpoint khác (env, beans, heapdump) lộ cấu hình
        # và cả mật khẩu DB — không bao giờ mở ra ngoài.
        include: health
  endpoint:
    health:
      show-details: never

# ---------------- Cấu hình riêng của ứng dụng ----------------
app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:7}

logging:
  level:
    root: INFO
    vn.tntt: INFO
